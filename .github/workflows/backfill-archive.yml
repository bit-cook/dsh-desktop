name: Manage stable release history

# Select stable rollback versions using existing signed GitHub Release assets.
# Shares the catalog lock and fail-closed publisher with normal releases.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to backfill (e.g. v0.6.3)
        required: true
        type: string
      stable_history:
        description: retain = mark as stable history; unpin = remove mark; keep = archive only
        required: true
        default: retain
        type: choice
        options:
          - retain
          - unpin
          - keep

permissions:
  contents: read

concurrency:
  group: desktop-version-catalog
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Download the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets \
            --pattern '*'
          ls -l release-assets
      - name: Verify historical release assets
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/verify-release-assets.mjs release-assets "${RELEASE_TAG#v}"
      - name: Archive to ModelScope and rebuild the version index
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          MODELSCOPE_REPO_ID: alexyaojin/dsh-desktop
          RELEASE_TAG: ${{ inputs.tag }}
          STABLE_HISTORY: ${{ inputs.stable_history }}
        run: |
          set -euo pipefail
          test -n "$MODELSCOPE_TOKEN" || { echo "::error::Missing secret MODELSCOPE_TOKEN"; exit 1; }
          python3 -m venv "$RUNNER_TEMP/ms-env"
          "$RUNNER_TEMP/ms-env/bin/pip" install -q modelscope
          "$RUNNER_TEMP/ms-env/bin/python3" .github/scripts/publish_release_archive.py \
            --tag "$RELEASE_TAG" --assets release-assets --stable-history "$STABLE_HISTORY"
