<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>DeepSeek Harness</title>
    <script>
      const splashTheme = new URLSearchParams(location.search).get('theme')
      document.documentElement.dataset.theme = splashTheme === 'dark' ? 'dark' : 'light'
      if (navigator.platform.toLowerCase().startsWith('win')) {
        document.documentElement.dataset.platform = 'windows'
      }
    </script>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { color: #17181a; background: #f8f8f6; }
      main {
        position: fixed;
        inset: 0;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 12px;
        padding: 32px;
        text-align: center;
      }
      .title { margin: 0; font-size: 24px; font-weight: 650; letter-spacing: -0.02em; }
      .status { margin: -4px 0 0; color: #777a80; font-size: 14px; }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(0, 0, 0, 0.1);
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 8px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      :root[data-theme='dark'] body {
        color: #f3f4f6;
        background: #141416;
      }
      :root[data-theme='dark'] .spinner {
        border-color: rgba(255, 255, 255, 0.1);
        border-top-color: #60a5fa;
      }
      :root[data-theme='dark'] .status {
        color: #9ca0a8;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) body { color: #f3f4f6; background: #141416; }
        :root:not([data-theme]) .spinner { border-color: rgba(255, 255, 255, 0.1); border-top-color: #60a5fa; }
        :root:not([data-theme]) .status { color: #9ca0a8; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="spinner" aria-hidden="true"></div>
      <h1 class="title">DeepSeek Harness</h1>
      <p class="status" id="status-text">Starting DeepSeek Harness…</p>
    </main>
    <script>
      // Listen for status updates or ready event from Tauri
      if (window.__TAURI__) {
        const { listen } = window.__TAURI__.event;
        listen('harness-status', (event) => {
          const el = document.getElementById('status-text');
          if (el && event.payload) {
            el.textContent = event.payload;
          }
        });
      }
    </script>
  </body>
</html>
